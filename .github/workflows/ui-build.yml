name: UI build

on:
  push:
    branches: [spotify-ui]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-build
  cancel-in-progress: true

env:
  COMPOSE_WEBVIEW_REPO: KRTirtho/ComposeNativeWebview
  COMPOSE_WEBVIEW_COMMIT: b11ac748de1219f9432338c067a2c5dafef3072a

jobs:
  ios:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      SKIP: ${{ matrix.kind == 'device' && !contains(github.event.head_commit.message, '[ipa]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 macOS runners are often out of capacity; the device build cross-compiles fine on Intel.
          - kind: device
            runner: macos-15-intel
          - kind: simulator
            runner: macos-15
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        if: env.SKIP != 'true'
        with:
          xcode-version: latest-stable
      - uses: actions/checkout@v7
        if: env.SKIP != 'true'
      - uses: actions/checkout@v7
        if: env.SKIP != 'true'
        with:
          repository: ${{ env.COMPOSE_WEBVIEW_REPO }}
          ref: ${{ env.COMPOSE_WEBVIEW_COMMIT }}
          path: compose-webview
      - uses: actions/setup-java@v6
        if: env.SKIP != 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        if: env.SKIP != 'true'
      # Rust 1.100 changed cargo's build-script output layout, which this Gobley version can't read yet.
      - uses: dtolnay/rust-toolchain@master
        if: env.SKIP != 'true'
        with:
          toolchain: 1.99.1
      - uses: gradle/actions/setup-gradle@v6
        if: env.SKIP != 'true'
      - name: Publish compose-webview
        if: env.SKIP != 'true'
        working-directory: compose-webview
        run: |
          chmod +x gradlew && ./gradlew publishToMavenLocal > ../webview.log 2>&1 || { tail -60 ../webview.log; cp ../webview.log ../build.log; exit 1; }
      - run: chmod +x gradlew
        if: env.SKIP != 'true'
      - uses: actions/cache@v6
        if: env.SKIP != 'true'
        with:
          path: iosApp/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('iosApp/Podfile.lock') }}
      - run: pod install --project-directory=iosApp
        if: env.SKIP != 'true'

      - name: Build device app
        if: env.SKIP != 'true' && (matrix.kind == 'device')
        env:
          ORG_GRADLE_PROJECT_nightly: false
          ORG_GRADLE_PROJECT_buildNumber: ${{ github.run_number }}
        run: |
          unset ANDROID_HOME ANDROID_SDK_ROOT
          code=0
          xcodebuild -workspace iosApp/iosApp.xcworkspace -scheme iosApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build > build.log 2>&1 || code=$?
          grep -E "^e: |error:|BUILD (SUCCEEDED|FAILED)" build.log | head -100 || true
          [ $code -eq 0 ] || exit $code
          APP=$(find build/ios/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -1)
          mkdir Payload && cp -R "$APP" Payload/ && zip -qry Spotube-ios.ipa Payload
          ls -la Spotube-ios.ipa

      - name: Build simulator app
        if: env.SKIP != 'true' && (matrix.kind == 'simulator')
        env:
          ORG_GRADLE_PROJECT_nightly: false
        run: |
          unset ANDROID_HOME ANDROID_SDK_ROOT
          code=0
          xcodebuild -workspace iosApp/iosApp.xcworkspace -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1 || code=$?
          grep -E "^e: |error:|BUILD (SUCCEEDED|FAILED)" build.log | head -100 || true
          [ $code -eq 0 ] || exit $code

      - name: Screenshots
        if: env.SKIP != 'true' && (matrix.kind == 'simulator')
        run: |
          mkdir -p shots
          APP=$(find build/sim/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" -type d | head -1)
          BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k in sorted(d,reverse=True) if 'iOS' in k for x in d[k] if 'iPhone' in x['name'] and 'Pro' in x['name'] and 'Max' not in x['name']))")
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl ui "$DEV" appearance dark || true
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl launch "$DEV" "$BID"
          sleep 15; xcrun simctl io "$DEV" screenshot shots/launch.png
          if [ -f .github/ui-shots.sh ]; then bash .github/ui-shots.sh "$DEV" "$BID" || true; fi
          xcrun simctl spawn "$DEV" log show --last 3m --predicate "process == \"$(basename "$APP" .app)\"" --style compact 2>/dev/null | tail -300 > shots/app.log || true

      - name: Publish output
        if: env.SKIP != 'true' && (always())
        run: |
          OUT=$RUNNER_TEMP/out; mkdir -p $OUT/${{ matrix.kind }}
          [ -f build.log ] && grep -E "^e: |^w: .*deprecated|error:|BUILD (SUCCEEDED|FAILED)" build.log | grep -v "^w:" | head -200 > $OUT/${{ matrix.kind }}/errors.txt || true
          [ -f build.log ] && tail -120 build.log > $OUT/${{ matrix.kind }}/tail.txt || true
          [ -d shots ] && cp -R shots $OUT/${{ matrix.kind }}/ || true
          if [ -f Spotube-ios.ipa ]; then split -b 45m Spotube-ios.ipa $OUT/${{ matrix.kind }}/Spotube-ios.ipa.part-; fi
          echo "${{ job.status }} ${{ github.sha }}" > $OUT/${{ matrix.kind }}/status.txt
          cd $OUT
          git init -q -b ci-${{ matrix.kind }}
          git config user.name ci && git config user.email ci@localhost
          git add -A && git commit -qm "run ${{ github.run_number }} ${{ matrix.kind }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-${{ matrix.kind }}

      - name: Release IPA
        if: env.SKIP != 'true' && (matrix.kind == 'device' && success())
        uses: softprops/action-gh-release@v2
        with:
          tag_name: spotify-ui
          name: Spotube UI
          prerelease: true
          files: Spotube-ios.ipa

  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.COMPOSE_WEBVIEW_REPO }}
          ref: ${{ env.COMPOSE_WEBVIEW_COMMIT }}
          path: compose-webview
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: tools platform-tools ndk;28.2.13676358
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: gradle/actions/setup-gradle@v6
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libcairo2-dev libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev xvfb imagemagick xdotool vlc libvlc-dev fonts-dejavu fonts-noto-core
      - name: Publish compose-webview
        working-directory: compose-webview
        run: |
          bash webview-compose/src/jvmMain/native/linux/build.sh > ../webview.log 2>&1 || { tail -40 ../webview.log; exit 1; }
          chmod +x gradlew && ./gradlew publishToMavenLocal >> ../webview.log 2>&1 || { tail -80 ../webview.log; cp ../webview.log ../build.log; exit 1; }
      - name: Compile desktop
        run: |
          chmod +x gradlew
          code=0
          ./gradlew :composeApp:jvmMainClasses --console=plain > build.log 2>&1 || code=$?
          grep -E "^e: |error:|BUILD (SUCCESSFUL|FAILED)" build.log | head -100 || true
          [ $code -eq 0 ] || exit $code
      - name: Screenshots
        run: bash .github/desktop-shots.sh || true
      - name: Publish output
        if: always()
        run: |
          OUT=$RUNNER_TEMP/out; mkdir -p $OUT/desktop
          [ -f build.log ] && grep -E "^e: |error:|BUILD (SUCCESSFUL|FAILED)|What went wrong" -A3 build.log | head -200 > $OUT/desktop/errors.txt || true
          [ -f build.log ] && tail -150 build.log > $OUT/desktop/tail.txt || true
          [ -f webview.log ] && tail -80 webview.log > $OUT/desktop/webview_tail.txt || true
          [ -d shots ] && cp -R shots $OUT/desktop/ || true
          echo "${{ job.status }} ${{ github.sha }}" > $OUT/desktop/status.txt
          cd $OUT
          git init -q -b ci-desktop
          git config user.name ci && git config user.email ci@localhost
          git add -A && git commit -qm "run ${{ github.run_number }} desktop"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-desktop
